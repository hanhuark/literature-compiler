[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "literature-compiler"
version = "0.1.0"
description = "Compile quantitative literature data with provenance-aware digitization and plotting workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Han Hu" }]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pillow>=10.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "scikit-image>=0.23",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
litcomp = "litcomp.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
